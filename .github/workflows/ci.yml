name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest

    # The generation ledger is real Postgres, so the ledger integration tests
    # run against a real database here. Without DATABASE_URL they skip, which
    # is what keeps `npm test` working on a laptop with no Postgres installed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comicmind
          POSTGRES_PASSWORD: comicmind
          POSTGRES_DB: comicmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://comicmind:comicmind@localhost:5432/comicmind_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test
