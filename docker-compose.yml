# Local development topology for the queued generation pipeline.
#
# This is the split the code is designed around: the API stays responsive
# while a separate worker process does the slow image work. Render's free
# tier runs a single process, so it sets WORKER_INLINE=true instead and hosts
# the worker inside the API.
#
#   docker compose up          bring up mongo, api, worker
#   docker compose stop worker kill the worker mid-generation; restart it and
#                              the queued panels are picked up where they left off
#
# Mongo holds all of it: comic content, the generation job ledger, and the
# panel queue the worker claims from. Set MONGODB_URI in your shell to point
# at Atlas instead.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:docker
    environment: &app-env
      NODE_ENV: development
      PORT: "5000"
      GENERATION_MODE: queue
      # Comic content, the job ledger and the panel queue all live here.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/comicmind}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker:docker
    environment: *app-env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo-data:
