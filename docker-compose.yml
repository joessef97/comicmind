# Local development topology for the queued generation pipeline.
#
# This is the split the code is designed around: the API stays responsive
# while a separate worker process does the slow image work. Render's free
# tier runs a single process, so it sets WORKER_INLINE=true instead and hosts
# the worker inside the API.
#
#   docker compose up          bring up postgres, redis, api, worker
#   docker compose stop worker kill the worker mid-generation; restart it and
#                              the queued panels are picked up where they left off

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: comicmind
      POSTGRES_PASSWORD: comicmind
      POSTGRES_DB: comicmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comicmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:docker
    environment: &app-env
      NODE_ENV: development
      PORT: "5000"
      GENERATION_MODE: queue
      DATABASE_URL: postgres://comicmind:comicmind@postgres:5432/comicmind
      REDIS_URL: redis://redis:6379
      # Content lives in Mongo; point this at a local mongod or an Atlas cluster.
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/comicmind}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker:docker
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres-data:
